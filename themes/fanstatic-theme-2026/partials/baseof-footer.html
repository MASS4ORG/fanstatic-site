<footer class="text-center py-3 bg-dark-subtle">
    <p>
        <span class=""
            >Made with
            <a href="https://Fanstatic.brunomassa.com"
                ><img
                    src="/Fanstatic-logo.svg"
                    height="24px"
                    width="100px"
                    alt="Fanstatic badge" /></a
            >.</span
        >
        <em>{{ site.Params.Footer }}</em>
    </p>

    <p>
        Site updated in {{ "now" | date: "%Y-%m-%d %H:%M" }} /
        <i>v{{ fanstatic.Version }}</i>
    </p>

    <p>
        <span
            >The Fanstatic logos are copyright ® {{ site.Copyright }} 2023-{{ "now"
            | date: "%Y" }}</span
        >
    </p>
</footer>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
></script>

<!-- Google tag (gtag.js) -->
<script
    async
    src="https://www.googletagmanager.com/gtag/js?id={{ site.Params.GoogleAnalytics }}"
></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {
        dataLayer.push(arguments);
    }
    gtag("js", new Date());
    gtag("config", "{{ site.Params.GoogleAnalytics }}");
</script>
