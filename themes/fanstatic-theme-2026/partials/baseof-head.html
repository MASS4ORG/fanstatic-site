<title>{{ page.Title }} - {{ site.Title }}</title>
{% if site.Description != nil -%}
<meta name="description" content="{{ site.Description }}" />
{% elsif site.Params.Description != nil -%}
<meta name="description" content="{{ site.Params.Description }}" />
{%- endif %}

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="canonical" href="{{ site.BaseURL }}{{ page.Permalink }}" />
<link
    rel="alternate"
    type="application/rss+xml"
    href="/blog/index.xml"
    title="Fanstatic Blog"
/>

<!-- Style and JS -->
<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1/font/bootstrap-icons.min.css"
    integrity="sha384-CK2SzKma4jA5H/MXDUU7i1TqZlCFaD4T01vtyDFvPlD97JQyS+IsSh1nI2EFbpyk"
    crossorigin="anonymous"
/>
<link rel="stylesheet" href="/style.css" />
<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
/>

<!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="msapplication-TileColor" content="#0d59ad" />
<meta name="theme-color" content="#ffffff" />
<link
    rel="manifest"
    href="/site.webmanifest"
    type="application/manifest+json"
/>
